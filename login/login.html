<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="title">
        <h1>Welcome to login page</h1>
    </div>
    <div class="main">
        <div id="name">
            <h4>Ursername<br><input type="text" id="name_text" placeholder="Enter you name"></h4>
        </div>
        <div id="password">
            <h4>Password<br><input type="password" id="password_text" placeholder="Password"></h4>
        </div>
        <div id="date">
            <h4>choice age group<br></h4>
            <input type="radio" name="age_group" value="12-18" id="child"><label for="child">12-18</label>
            <input type="radio" name="age_group" value="19-30" id="Adult"><label for="Adult">19-30</label>
            <input type="radio" name="age_group" value="31-60" id="Senior"><label for="Senior">31-60</label>
        </div>
        <div id="button">
            <input type="button" id="login" value="Login">
        </div>
    </div>
    <script src="login.js"></script>
</body>
</html>
